# -----------------------------------------------------------------------------
# Quick info on tmux configuration:
# bind / bind-key (equal): Bind a key to a command ()
# 
# -----------------------------------------------------------------------------

# RELOAD CONFIG:
# From inside tmux: Press <Prefix (ctrl +a) & r > to reload the config file and see a confirmation message.
# From shell: tmux source-file ~/.tmux.conf
# -----------------------------------------------------------------------------
bind r source-file ~/.dotfiles/tmux/.tmux.conf \; display "Config reloaded!"

# Set the default prefix key to Ctrl-a (Ctrl-b is the default)
unbind C-b
set-option -g prefix C-a
# Send a literal C-a (nested/remote tmux, bash start-of-line) with `prefix a`, screen
# style. C-a C-a is last-window below; binding C-a to send-prefix here as well was
# silently overridden by that.
bind-key a send-prefix

# Set terminal capabilities for 256 colors and RGB support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# -----------------------------------------------------------------------------
# CORE SETTINGS & MOUSE (Fixes Warp Pane Copy Issue)
# -----------------------------------------------------------------------------

# Enable mouse mode for selecting panes, resizing, and scrolling
set -g mouse on

# Set vi-like keybindings in copy mode
set-window-option -g mode-keys vi

# Copying to the Windows clipboard (stays inside the pane, unlike Shift+drag):
#   - Mouse: drag with the left button, release -> copied
#   - Keys:  <Prefix> + [ , Space to start, move, then y or Enter -> copied
# Every tmux copy is piped to copy-command (clip.exe under WSL, set below) AND sent to
# the terminal via OSC 52 (set-clipboard). The pipe is what makes it work in any
# terminal: classic conhost ignores OSC 52 entirely. Paste inside tmux: <Prefix> + ].
# Shift+drag is a terminal-side selection and only works in terminals that support it
# (Windows Terminal: yes, conhost: no).
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Fix Warp/Terminal Clipboard: Removing the custom terminal-override that caused conflicts.
# #set -g terminal-overrides ",xterm-256color:Ms=\\E[<0;*M" (Removed)

# Set history limit for scrollback buffer
set -g history-limit 50000

# -----------------------------------------------------------------------------
# WINDOW & PANE MANAGEMENT
# -----------------------------------------------------------------------------

# Start index counting at 1 (more intuitive than 0)
set-option -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# Automatically rename windows based on content
set-window-option -g automatic-rename on
set-option -g set-titles on

# Renumber windows sequentially when a window is closed
set -g renumber-windows on

# Open new windows in the current pane's path
bind c new-window -c "#{pane_current_path}"

# Split vertically/horizontally in the current pane's path
bind | split-window -h -c "#{pane_current_path}" # Horizontal split
bind - split-window -v -c "#{pane_current_path}" # Vertical split

# Switch to the last window
bind-key C-s last-window
bind-key C-a last-window # Also bind 'C-a' to switch to last window

# Rename the current window
bind , command-prompt "rename-window '%%'"

# Kill the current window with confirmation
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window

# Detach session
bind-key d detach

# Tmux menus
# Coffee plugin manager handles plugin sourcing and plugin configuration
set -g @menus_config_file "$HOME/.tmux.conf"   # used by the menu's "Reload tmux conf"
set -g @menus_show_key_hints 'Yes'          # Show key hints in menus

# Integrate with system clipboard: OSC 52 for terminals that support it (Windows
# Terminal, most Linux terminals), plus clip.exe under WSL so it works everywhere.
# Plain UTF-8 into clip.exe keeps åäö/€ intact (tested; UTF-16 conversion garbles them).
# Guarded so the same config is harmless on hosts without clip.exe.
set -g set-clipboard on
if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s copy-command 'clip.exe'
}
# Allow passthrough for OSC sequences (for better clipboard and title integration)
set -g allow-passthrough on

# -----------------------------------------------------------------------------
# CUSTOM SHORTCUTS
# -----------------------------------------------------------------------------
# # Custom shortcuts
# bind -n C-e new-window -c "#{pane_current_path}" -n 'editor' "$EDITOR"
# bind -n M-e new-window -c "$HOME" -n 'dotfiles' "yadm enter $EDITOR"

# Popups (frequent use keeps a direct key; everything else is in the Tools menu)
bind h display-popup -w 80% -h 80% -T "Htop" -E "htop"
bind l display-popup -w 60% -h 40% -T "lazyports" -E "lazyports"
bind b display-popup -w 80% -h 80% -T "B-Top" -E "btop"

# Moved to the Tools menu: prefix + \ -> Custom items -> Tools
# (source: tmux/menus/tools.sh, installed by tmux_installer.sh). Unbound explicitly so a
# config reload drops them too; L and m get tmux's own defaults back, which these keys
# used to shadow.
unbind-key H                    # htop window      -> Tools: H
unbind-key B                    # btop window      -> Tools: B
unbind-key u                    # urlview          -> Tools: u
unbind-key e                    # sync panes       -> Panes menu: "Toggle synchronized panes"
unbind-key j                    # was broken (no `tmux-menus` command); menus: prefix + backslash
bind-key L switch-client -l     # tmux default; lazyports window -> Tools: L
bind-key m select-pane -m       # tmux default; man page         -> Tools: m

# # smart lazygit
# bind -n C-g popup -d '#{pane_current_path}' -E -w 90% -h 90% fish -c 'gg'

# -----------------------------------------------------------------------------
# TMUX MENUS & PLUGIN CONFIGURATION
# -----------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.local/share/coffee/coffee.tmux

# -----------------------------------------------------------------------------
# KEYBOARD NAVIGATION
# -----------------------------------------------------------------------------

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# -----------------------------------------------------------------------------
# NOTIFICATIONS & VISUALS
# -----------------------------------------------------------------------------

# Highlight windows when activity occurs
set -g monitor-activity on
set -g visual-activity on
set -g message-style 'bg=#00e68a fg=#000000 bold'   # Message style for notifications

# Clock mode color
set-window-option -g clock-mode-colour colour64     # Green

# Set up character set overrides for line drawing (often needed on remote hosts)
set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'

# -----------------------------------------------------------------------------
# STATUS BAR (THEME)
# -----------------------------------------------------------------------------

# Status bar style and refresh
set -g status on
set -g status-interval 30                   # Interval in seconds (5)
set -g status-bg black                      # Status background
set -g status-fg white                      # Status foreground
set -g status-justify left                  # Justify left
set -g status-left-length 120               # Left length
set -g status-right-length 140              # Right length

# Window Title Bar (Status Line 0 - Above the status bar)
# Shows prefix highlight, current user, host, and public IP address
set -g set-titles-string ' #{prefix_highlight} #(whoami) | #h | #(curl -s ipecho.net/plain;echo)'

# Highlight the current window's title
set -g window-status-current-format "#[bg=white,fg=black,bold]#I:#W#[default]"

# Status Bar Left: [Online Status | Date/Time |Mem/Cpu-load] / [Repo | branch: status ]
set -g status-left ' Online: #{online_status} #[default]#[fg=white]| #[fg=white]%Y-%m-%d (#[fg=grey]%H:%M#[default])'

# Status Bar Right: [ Prefix Highlight | CPU | RAM | User | Host | WAN/Local IP Toggle ]
# Note: format string must be URL-safe — spaces in @forecast-format cause curl error 3
# IP toggle: calls coffee plugin @ ~/.dotfiles/tmux/coffee/plugins/tmux-ip-toggle/tmux-ip_toggle.sh
#
# Continuum autosave hook goes first, set explicitly: continuum only adds it itself when its
# ps-based "another tmux server running?" check says no, and start_tmux.sh's burst of tmux
# commands at startup made that check misfire -- so autosave never ran (no save since
# 2026-05-13). The socket is pinned to /tmp (one server), so wiring it here is safe. The
# path must match continuum's own string exactly so it doesn't prepend a second copy.
# The seed below delays the first autosave by one interval (what continuum does on first
# load), so a fresh server can't overwrite the last good save before continuum-restore runs.
if-shell -F '#{==:#{@continuum-save-last-timestamp},}' {
    run-shell 'tmux set -g @continuum-save-last-timestamp "$(date +%s)"'
}
set -g status-right "#($HOME/.tmux/coffee/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -ga status-right '#{prefix_highlight}|#{forecast}|#{claude_usage} %Y-%m-%d|#{cpu_bg_color}CPU:#{cpu_icon}#{cpu_percentage} #[default]#[fg=white]|#{ram_bg_color}RAM:#{ram_icon} #{ram_percentage} #[default]#[fg=white]| #[fg=Green]#(whoami)#[fg=white] | #[fg=grey]#(hostname -s)#[fg=white] | #(~/.dotfiles/tmux/coffee/plugins/tmux-ip-toggle/tmux-ip_toggle.sh)   '

# -----------------------------------------------------------------------------
# COFFEE PLUGIN MANAGER
# -----------------------------------------------------------------------------

# Source Coffee plugin manager (guarded — absent on fresh install until tmux_installer.sh runs)
if-shell '[ -f ~/.local/share/coffee/coffee.tmux ]' 'source-file ~/.local/share/coffee/coffee.tmux'

# Sidebar/Tree Listing Plugin Configuration
# The tmux-sidebar plugin provides default bindings:
# - prefix + Tab        : toggle sidebar
# - prefix + Backspace  : toggle sidebar and focus it
# Custom tree command for colorized output
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-width '10'
set -g @sidebar-tree-position 'left'

# -----------------------------------------------------------------------------
# PLUGIN ICONS & CONFIGURATION
# -----------------------------------------------------------------------------

# Online/Offline status icons
set -g @online_icon "#[fg=green]Yes"
set -g @offline_icon "#[fg=orange]No"

# Battery icons 
set -g @batt_charged_icon "✔"
set -g @batt_charging_icon "⚡"
set -g @batt_attached_icon "🔌"
set -g @batt_full_charge_icon "🌕 "
set -g @batt_high_charge_icon "🌖 "
set -g @batt_medium_charge_icon "🌗 "
set -g @batt_low_charge_icon "🌘 "

# -----------------------------------------------------------------------------
# WEATHER & CONFIGURATION
# -----------------------------------------------------------------------------

# aaronpowell/tmux-weather (wttr.in, no API key) -> #{forecast} in status-right.
# Only @forecast-* options are read by this plugin. (The @tmux-weather-* options for
# ilya-manin/tmux-weather, including an API key, were dead config and were removed.)
set -g @forecast-format '%C|%t'                     # URL-safe format — spaces in the value break curl (error 3)
set -g @forecast-location stockholm
set -g @forecast-language "sv"
set -g @forecast-cache-duration 1800                # 30 minutes

# Specific Plugin Configurations
set -g @continuum-restore 'on'                      # Enable automatic restore of sessions
# Off: this continuum version only implements boot-start on macOS. The old TPM-era version
# left ~/.config/systemd/user/tmux.service behind, which spawned a stray session "0" at boot
# racing start_tmux.sh. tmux is started by .bashrc auto-start instead.
set -g @continuum-boot 'off'

# Set the PATH environment variable for plugins that rely on external commands (like btop, urlview, etc.)
set-environment -g PATH "/usr/local/bin:/usr/bin:/bin:$PATH"

# Plugin config for tmux-task-monitor
unbind-key t
set -g @tmux_resource_monitor_refresh_rate "2.0"    # Refresh rate in seconds (default: 2.0)
set -g @tmux_resource_monitor_width "80%"           # Popup width (default: 80%)
set -g @tmux_resource_monitor_height "40%"          # Popup height (default: 80%)
set -g @tmux_resource_monitor_key "t"               # Key binding to toggle the resource monitor popup (default: t)
set -g @tmux_resource_monitor_overview_key "T"      # Overview key binding (default: T)

# Manual keybindings for tmux-task-monitor
bind-key t run-shell "~/.tmux/coffee/plugins/tmux-task-monitor/scripts/launch_monitor.sh"
bind-key T run-shell "~/.tmux/coffee/plugins/tmux-task-monitor/scripts/launch_overview.sh"

# Plugin config for tmux-ip-toggle
set -g @ip_toggle_interval 300                      # toggle every 5 minutes

# Plugin for claude-usage: installed/loaded by Coffee via
# ~/.config/tmux/coffee/plugins/tmux-claude-usage.yaml (a TPM-style `set -g @plugin` line
# here was malformed and errored on every config load)


# -----------------------------------------------------------------------------
# PLUGINS
